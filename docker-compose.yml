services:
  postgres:
    ports:
      - "${POSTGRES_HOST_PORT}:5432"
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${TASKS_DB_DATABASE}
      AUTH_DB_DATABASE: ${AUTH_DB_DATABASE}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${TASKS_DB_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    restart: unless-stopped
    environment:
      STAGE: ${STAGE:-dev}
      PORT: ${AUTH_PORT}
      GRPC_PORT: ${AUTH_GRPC_PORT}
      PROTO_PATH: /app/proto/auth/auth_service.proto
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_DATABASE: ${AUTH_DB_DATABASE}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('node:net').connect(${AUTH_GRPC_PORT}, '127.0.0.1').on('connect', function() { this.end(); process.exit(0); }).on('error', () => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    restart: unless-stopped
    environment:
      STAGE: ${STAGE:-dev}
      PORT: ${GATEWAY_PORT}
      AUTH_GRPC_URL: auth-service:${AUTH_GRPC_PORT}
      TASKS_GRPC_URL: tasks-service:${TASKS_GRPC_PORT}
      FILES_GRPC_URL: files-service:${FILES_GRPC_PORT}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS}
      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE}
      GRPC_TIMEOUT_MS: ${GRPC_TIMEOUT_MS}
    ports:
      - "${GATEWAY_PORT}:${GATEWAY_PORT}"
    depends_on:
      auth-service:
        condition: service_healthy
      tasks-service:
        condition: service_healthy
      files-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('node:http').get('http://127.0.0.1:${GATEWAY_PORT}/health', response => process.exit(response.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  files-service:
    build:
      context: .
      dockerfile: files-service/Dockerfile
    restart: unless-stopped
    environment:
      STAGE: ${STAGE:-dev}
      GRPC_PORT: ${FILES_GRPC_PORT}
      PROTO_PATH: /app/proto/files/files_service.proto
      TASKS_GRPC_URL: tasks-service:${TASKS_GRPC_PORT}
      TASKS_GRPC_TIMEOUT_MS: ${TASKS_GRPC_TIMEOUT_MS}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_DATABASE: ${FILES_DB_DATABASE}
      FILE_DIR: /app/storage
    volumes:
      - ./files-service/storage/:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      tasks-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('node:net').connect(${FILES_GRPC_PORT}, '127.0.0.1').on('connect', function() { this.end(); process.exit(0); }).on('error', () => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  tasks-service:
    build:
      context: .
      dockerfile: tasks-service/Dockerfile
    restart: unless-stopped
    environment:
      STAGE: ${STAGE:-dev}
      PORT: ${TASKS_PORT}
      GRPC_PORT: ${TASKS_GRPC_PORT}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_DATABASE: ${TASKS_DB_DATABASE}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      PROTO_ROOT: /app/proto
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('node:net').connect(${TASKS_GRPC_PORT}, '127.0.0.1').on('connect', function() { this.end(); process.exit(0); }).on('error', () => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
