services:
  postgres:
    ports:
      - "${DB_PORT}:5432"
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${TASKS_DB_DATABASE}
      AUTH_DB_DATABASE: ${AUTH_DB_DATABASE}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${TASKS_DB_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 5

  files-service:
    build:
      context: ./files-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      STAGE: dev
      GRPC_PORT: ${FILES_GRPC_PORT}
      DB_HOST: postgres
      DB_PORT: ${DB_PORT}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_DATABASE: ${FILES_DB_DATABASE}
      FILE_DIR: /app/storage
    volumes:
      - ./files-service/storage/:/app/storage
    depends_on:
      postgres:
        condition: service_healthy

  tasks-service:
    build:
      context: ./tasks-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      STAGE: dev
      PORT: ${TASKS_PORT}
      DB_HOST: postgres
      DB_PORT: ${DB_PORT}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_DATABASE: ${TASKS_DB_DATABASE}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      FILES_GRPC_URL: files-service:${FILES_GRPC_PORT}
    ports:
      - "${TASKS_PORT}:${TASKS_PORT}"
    depends_on:
      postgres:
        condition: service_healthy
      files-service:
        condition: service_started

volumes:
  postgres-data:
  files-storage:
